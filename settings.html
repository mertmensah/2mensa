<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2mensa Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-wrap">
        <button class="icon-btn" id="toggleSidebar" aria-label="Toggle navigation">☰</button>
        <h1 class="brand">2mensa</h1>
        <button class="icon-btn mini" id="audioToggle" aria-label="Toggle sound" title="Toggle sound">🔊</button>
      </div>

      <nav class="menu">
        <a class="menu-item" href="index.html">Home</a>
        <a class="menu-item active" href="settings.html">Settings</a>
        <button class="menu-item expand-toggle" id="modulesToggle" aria-expanded="true">Modules ▾</button>
        <div class="submenu" id="modulesMenu">
          <a class="submenu-item" href="modules/sudoku.html">Sudoku</a>
          <a class="submenu-item" href="modules/trivia.html">Speed Trivia</a>
          <a class="submenu-item" href="modules/logic-grid.html">Logic Grid</a>
          <a class="submenu-item" href="modules/sequence-sprint.html">Sequence Sprint</a>
          <a class="submenu-item" href="modules/raven-matrix.html">Raven Matrix</a>
          <a class="submenu-item" href="modules/spatial-rotation.html">Spatial Rotation</a>
          <span class="submenu-item disabled">Pattern Recall (soon)</span>
        </div>
      </nav>

      <footer class="sidebar-foot">Tune your training environment.</footer>
    </aside>

    <main class="main-content">
      <header class="hero">
        <p class="eyebrow">Preferences</p>
        <h2>Settings</h2>
        <p>Control readability, motion, and data without leaving 2mensa.</p>
      </header>

      <section class="settings-panel">
        <label class="setting-row" for="prefReducedMotion">
          <span>
            <strong>Reduced Motion</strong>
            <small>Minimize animations and transitions.</small>
          </span>
          <input id="prefReducedMotion" type="checkbox" />
        </label>

        <label class="setting-row" for="prefHighContrast">
          <span>
            <strong>High Contrast</strong>
            <small>Increase text and border contrast.</small>
          </span>
          <input id="prefHighContrast" type="checkbox" />
        </label>

        <label class="setting-row" for="prefLargeText">
          <span>
            <strong>Large Text</strong>
            <small>Increase base font size across the app.</small>
          </span>
          <input id="prefLargeText" type="checkbox" />
        </label>

        <div class="settings-actions">
          <button id="savePrefsBtn" class="game-btn">Save Preferences</button>
          <button id="resetStatsBtn" class="game-btn ghost">Reset Game Stats</button>
        </div>

        <p id="settingsStatus" class="status" aria-live="polite">Adjust preferences and save.</p>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
  <script src="settings.js"></script>
</body>
</html>
